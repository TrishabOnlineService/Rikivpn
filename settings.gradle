pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        // Start.io repo kept as a fallback ONLY for com.startapp artifacts.
        // Everything it hosts is also on Maven Central (checked first), so this
        // host is never contacted unless Central is missing a com.startapp module.
        maven {
            url = uri("https://maven.startapp.com/artifactory/repo")
            content { includeGroup("com.startapp") }
        }
    }
}

rootProject.name = "Rikivpn"
include ':app'
